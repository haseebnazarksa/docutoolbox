<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Text Case Converter — UPPERCASE, lowercase, Title Case | Docutoolbox</title>
<meta name="description" content="Free online text case converter. Instantly switch text between UPPERCASE, lowercase, Title Case, Sentence case, and aLtErNaTiNg case.">
<link rel="canonical" href="https://haseebnazarksa.github.io/docutoolbox/text-case-converter.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-deep:#0A2E45; --blue-card:#0E3550; --grid-line:rgba(160,205,225,0.09);
    --linework:#6FB8D9; --linework-soft:#3E7C99; --accent:#FF6B35; --accent-soft:#FF8A5C;
    --ink:#EDF3F6; --text-muted:#8FADC0; --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/40px 40px,
      radial-gradient(ellipse 1000px 600px at 50% -5%, rgba(111,184,217,0.10), transparent 60%),
      var(--blue-deep);
    color:var(--ink); font-family:'IBM Plex Sans',sans-serif; min-height:100vh; padding:0 0 60px;
  }
  a{color:inherit;}
  .wrap{max-width:720px; margin:0 auto; padding:0 20px;}
  header.site{ background:rgba(10,46,69,0.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--grid-line); margin-bottom:50px;}
  .navbar{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; max-width:1120px; margin:0 auto; flex-wrap:wrap; gap:12px;}
  .logo{ display:flex; align-items:center; gap:10px; text-decoration:none; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  .logo-mark{ width:28px; height:28px; border:1.5px solid var(--linework); border-radius:6px; position:relative;}
  .logo-mark::before{ content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:12px; height:1.5px; background:var(--accent);}
  .logo-mark::after{ content:""; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:1.5px; height:12px; background:var(--accent);}
  .nav-links{ display:flex; align-items:center; gap:22px; font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.04em; flex-wrap:wrap;}
  .nav-links a{ text-decoration:none; color:var(--text-muted); transition:color 0.15s ease;}
  .nav-links a:hover, .nav-links a.active{ color:var(--linework);}
  .eyebrow{ display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--linework); margin-bottom:16px; justify-content:center;}
  .eyebrow::before{content:"◇ ";}
  h1{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(28px,5.5vw,42px); line-height:1.1; text-align:center; margin-bottom:14px; letter-spacing:-0.01em;}
  header.hero-head p{ color:var(--text-muted); font-size:15px; max-width:460px; margin:0 auto 36px; line-height:1.6; text-align:center;}
  .card{ background:var(--blue-card); border:1px solid var(--grid-line); border-radius:var(--radius); padding:26px;}
  textarea{ width:100%; min-height:200px; background:var(--blue-deep); border:1px solid var(--grid-line); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; font-size:15px; line-height:1.6; padding:16px; border-radius:10px; resize:vertical;}
  textarea:focus{ outline:none; border-color:var(--linework);}
  textarea::placeholder{ color:var(--text-muted);}
  .case-buttons{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px;}
  .case-btn{ flex:1 1 auto; min-width:130px; background:var(--blue-deep); border:1px solid var(--grid-line); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; font-weight:500; font-size:13px; padding:11px 14px; border-radius:8px; cursor:pointer; transition:border-color 0.15s ease, color 0.15s ease;}
  .case-btn:hover{ border-color:var(--linework); color:var(--linework);}
  .toolbar{ display:flex; justify-content:flex-end; gap:10px; margin-top:16px;}
  .btn{ background:transparent; border:1px solid var(--grid-line); color:var(--text-muted); font-family:'IBM Plex Sans',sans-serif; font-size:13px; padding:8px 16px; border-radius:8px; cursor:pointer; transition:border-color 0.15s ease, color 0.15s ease;}
  .btn:hover{ border-color:var(--linework); color:var(--linework);}
  .btn.primary{ background:var(--accent); color:#0A2E45; border:none; font-weight:600;}
  .btn.primary:hover{ background:var(--accent-soft); color:#0A2E45;}
  footer.site{ text-align:center; margin-top:48px; color:var(--text-muted); font-size:11px; font-family:'IBM Plex Mono',monospace; letter-spacing:0.06em;}
  footer.site a{ color:var(--text-muted); text-decoration:underline;}
  footer.site a:hover{ color:var(--linework);}
</style>
</head>
<body>

<header class="site">
  <div class="navbar">
    <a href="index.html" class="logo"><span class="logo-mark"></span>Docutoolbox</a>
    <nav class="nav-links">
      <a href="age-calculator.html">Age Calculator</a>
      <a href="word-counter.html">Word Counter</a>
      <a href="text-case-converter.html" class="active">Case Converter</a>
      <a href="image-compressor.html">Image Compressor</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <header class="hero-head">
    <div class="eyebrow">Docutoolbox</div>
    <h1>Text case converter</h1>
    <p>Type or paste text, then pick a case below. Your text is edited instantly, right here in your browser.</p>
  </header>

  <div class="card">
    <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
    <div class="case-buttons">
      <button class="case-btn" id="btnUpper">UPPERCASE</button>
      <button class="case-btn" id="btnLower">lowercase</button>
      <button class="case-btn" id="btnTitle">Title Case</button>
      <button class="case-btn" id="btnSentence">Sentence case</button>
      <button class="case-btn" id="btnAlternating">aLtErNaTiNg cAsE</button>
    </div>
    <div class="toolbar">
      <button class="btn" id="clearBtn">Clear</button>
      <button class="btn primary" id="copyBtn">Copy result</button>
    </div>
  </div>

  <footer class="site">MORE TOOLS AT <a href="index.html">Docutoolbox</a> · <a href="about.html">About</a></footer>
</div>

<script>
  const textInput = document.getElementById('textInput');
  document.getElementById('btnUpper').addEventListener('click', () => { textInput.value = textInput.value.toUpperCase(); });
  document.getElementById('btnLower').addEventListener('click', () => { textInput.value = textInput.value.toLowerCase(); });
  document.getElementById('btnTitle').addEventListener('click', () => {
    textInput.value = textInput.value.replace(/\w\S*/g, (word) => word.charAt(0).toUpperCase() + word.substr(1).toLowerCase());
  });
  document.getElementById('btnSentence').addEventListener('click', () => {
    const lower = textInput.value.toLowerCase();
    textInput.value = lower.replace(/(^\s*\w|[.!?]\s*\w)/g, (c) => c.toUpperCase());
  });
  document.getElementById('btnAlternating').addEventListener('click', () => {
    textInput.value = textInput.value.split('').map((c, i) => (i % 2 === 0 ? c.toLowerCase() : c.toUpperCase())).join('');
  });
  document.getElementById('clearBtn').addEventListener('click', () => { textInput.value = ''; textInput.focus(); });
  document.getElementById('copyBtn').addEventListener('click', () => {
    textInput.select(); document.execCommand('copy');
    navigator.clipboard && navigator.clipboard.writeText(textInput.value).catch(()=>{});
  });
</script>

</body>
</html>
